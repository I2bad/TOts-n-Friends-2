        <h1>Tots &amp; Friends Childcare Centre</h1>
        <p><strong>Taska / Tadika in Jenjarom, Selangor, Malaysia.</strong> A nurturing early childhood education centre operated under Tadika Pelita Ilmuku (TPI). We provide play-based learning inspired by Reggio Emilia and Montessori approaches for children aged 6 months to 8 years.</p>

        <h2>Visit Us</h2>
        <address>
          No. 17, Jalan Jambu Mawar 3, Taman Sri Jarom,<br />
          42600 Jenjarom, Selangor, Malaysia<br />
          Phone / WhatsApp: <a href="tel:+60173078621">+60 17-307 8621</a><br />
          Email: <a href="mailto:janet@tpi.edu.my">janet@tpi.edu.my</a><br />
          Hours: Monday – Friday, 8am – 6pm (Closed Saturday &amp; Sunday)
        </address>

        <h2>Our Programmes</h2>
        <ul>
          <li><strong>Infant Care (6-12 months)</strong> — Supervised care in a warm, nurturing environment with sensory-rich activities.</li>
          <li><strong>Toddler Class (1-3 years)</strong> — Exploratory learning for early walkers, focusing on motor skills, language, and social development.</li>
          <li><strong>Daycare</strong> — Flexible half-day or full-day care with structured learning, play, meals, and rest.</li>
          <li><strong>Enrichment Classes</strong> — Weekly theme-based arts and discovery sessions every Thursday.</li>
        </ul>

        <h2>Our Values</h2>
        <p>Kindness &amp; Empathy, Curiosity &amp; Exploration, Inclusivity &amp; Belonging, Safety &amp; Trust, Creativity &amp; Joy, Growth &amp; Resilience.</p>

        <h2>Our Story</h2>
        <p>Founded in 2018, Tots &amp; Friends started with just 10 children and a big dream. We introduced play-based classrooms in 2019, adapted with online classes during the pandemic (2020-2022), reopened in 2023 with expanded age groups, and in 2025 hosted our very first concert in a full-sized hall.</p>

        <h2>Meet Our Team</h2>
        <ul>
          <li><strong>Principal Janet</strong> — "At Tots, I love chatting with the children, listening to their stories, and watching them grow in confidence. I strive to create a warm, safe, and fun environment for every child."</li>
          <li><strong>Teacher Tan</strong> — "Being part of the Tots team means working with children I care about, building a fun learning environment, and growing alongside my colleagues."</li>
          <li><strong>Teacher Harinesh</strong> — "Tots is where my teaching journey began. When I joined in 2023 I had little experience, but I've grown so much since."</li>
          <li><strong>Teacher Yong</strong> — "Children learn through doing, exploring, and sometimes making a beautiful mess. I create spaces where curiosity is always encouraged."</li>
          <li><strong>Teacher Xin Hui</strong> — "What I value most is the teamwork, open communication, and the time I get to spend with the children."</li>
          <li><strong>Teacher Syamila</strong> — "The teamwork, guidance, and positive atmosphere here make teaching at Tots a truly meaningful experience."</li>
          <li><strong>Teacher Lethu</strong> — "At Tots, I love working with the kids and enjoying their little quirks. I'm grateful to our Principal for this opportunity."</li>
          <li><strong>Assistant Kala</strong> — "I am here to make sure every child feels comfortable and happy from the moment they arrive."</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <dl>
          <dt><strong>What ages do you accept?</strong></dt>
          <dd>We welcome children from 6 months through to 8 years old.</dd>
          <dt><strong>What are your operating hours?</strong></dt>
          <dd>Monday to Friday, 8am to 6pm. Closed weekends and Malaysian public holidays.</dd>
          <dt><strong>What curriculum do you use?</strong></dt>
          <dd>Our approach is inspired by the Reggio Emilia philosophy and Montessori principles — child-led, play-powered learning.</dd>
          <dt><strong>What language is used at the centre?</strong></dt>
          <dd>We teach and communicate in English, giving children a strong foundation from an early age.</dd>
          <dt><strong>How do I enrol my child?</strong></dt>
          <dd>Reach out via WhatsApp, phone, or the contact form. We'll arrange a tour and guide you through enrolment.</dd>
        </dl>
